name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-typecheck-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.x"
      - name: Install
        run: uv sync
      - name: Lint
        run: uv run ruff check .
      - name: Typecheck
        run: uv run mypy
      - name: Test (with coverage gate)
        run: uv run pytest

  pipeline:
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.x"
      - name: Install
        run: uv sync
      - name: End-to-end pipeline on the 2k-row fixture (offline)
        run: uv run python -m uplift.report --split test --fixture
      - name: README numbers match reports/metrics.json
        run: uv run python scripts/check_readme_numbers.py
