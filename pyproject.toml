[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "uplift-lab"
version = "0.1.0"
description = "Causal targeting engine: estimate heterogeneous treatment effects and turn them into a decision."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "supreme" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
causal-forest = ["econml>=0.15"]

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["src/uplift"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --cov=uplift --cov-report=term-missing --cov-fail-under=85"
filterwarnings = ["error::FutureWarning"]
markers = [
    "integration: slower end-to-end checks (still offline)",
]

[tool.coverage.run]
source = ["src/uplift"]
branch = false

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PT", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["lightgbm", "lightgbm.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["econml", "econml.*"]
ignore_missing_imports = true
